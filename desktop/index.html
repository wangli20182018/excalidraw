<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no" />
    <title>AI Multimedia Workspace</title>
    <style>
      html, body, #root { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
    <script>
      // Excalidraw reads font assets relative to this path during dev
      window.EXCALIDRAW_ASSET_PATH = window.origin;
      // throttle scene rendering (matches excalidraw-app) for smoother pan/zoom/search
      window.EXCALIDRAW_THROTTLE_RENDER = true;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
