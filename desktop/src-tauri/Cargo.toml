[package]
name = "desktop"
version = "0.0.1"
description = "AI Multimedia Workspace"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# future: OG proxy / embeddings
# reqwest = { version = "0.12", features = ["json"] }
# scraper = "0.20"
# tokio = { version = "1", features = ["full"] }

[features]
# this feature is used for production builds where `devUrl` is disabled
custom-protocol = ["tauri/custom-protocol"]
